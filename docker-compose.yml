# 루트에서 `docker compose build`로 backend/anti-cheat를 한 번에 빌드하기 위한 파일.
# Dockerfile은 옮기지 않고 각자 폴더(backend/, anti-cheat/)에 그대로 둔 채,
# 여기서는 그 경로만 가리킨다 — 두 서비스는 배포 주기가 다른 별개 서비스라
# 같이 실행(up)할 필요는 없고, 로컬에서 둘 다 제대로 빌드되는지 한 번에
# 확인하고 싶을 때 쓴다.

services:
  backend:
    build:
      context: ./backend
      target: production
    image: k-test-backend:local
    env_file:
      - ./backend/.env
    ports:
      - '${BACKEND_PORT:-3000}:3000'

  anti-cheat:
    build:
      context: ./anti-cheat
    image: k-test-anti-cheat:local
    env_file:
      - ./anti-cheat/.env
    environment:
      - PORT=8080
    ports:
      - '${ANTI_CHEAT_PORT:-8080}:8080'
